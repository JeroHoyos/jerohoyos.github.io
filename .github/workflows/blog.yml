# Regenera el blog cada vez que cambia algo en posts/ (o en el generador).
# Así también puedes publicar subiendo un .md desde la web de GitHub (Add file → Create new file en posts/).
name: blog

on:
  push:
    branches: [main]
    paths: ['posts/**', 'tools/**', 'index.html']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/blog.mjs
      - name: Commit si algo cambió
        run: |
          if [ -n "$(git status --porcelain -- blog index.html sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- blog index.html sitemap.xml
            git commit -m "blog: regenerar páginas"
            git push
          else
            echo "Nada que regenerar."
          fi
